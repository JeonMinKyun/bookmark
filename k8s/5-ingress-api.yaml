apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookmarker-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  rules:
    - http:
        paths:
          - path: /bookmarker-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: bookmarker-api-svc
                port:
                  number: 8080