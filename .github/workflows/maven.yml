name: Java CI with Maven

on:
  push:
    branches:
      - "**"

jobs:
  #######################################################
  # Spring Boot API Build
  #######################################################
  build-bookmark-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookmarker-api

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Maven Build
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw verify

      # Docker Image Build & Push
      - name: Build and Push API Image
        if: github.ref == 'refs/heads/main'
        run: |
          ./mvnw clean package jib:dockerBuild -DskipTests

          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

          docker build \
            -t myimage:latest .

          docker tag myimage:latest \
            ${{ secrets.DOCKER_USERNAME }}/bookmarker-api:latest

          docker push \
            ${{ secrets.DOCKER_USERNAME }}/bookmarker-api:latest


  #######################################################
  # Next.js UI Docker Build & Push
  #######################################################
  build-bookmarker-ui:
    name: Build bookmarker-ui
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookmark-ui-nextjs

    steps:
      # Source Checkout
      - name: Checkout repository
        uses: actions/checkout@v5


      # Docker Hub Login
      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin


      # Docker Image Build
      - name: Build Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            --build-arg SERVER_SIDE_API_BASE_URL="${{ secrets.SERVER_SIDE_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_CLIENT_SIDE_API_BASE_URL="${{ secrets.NEXT_PUBLIC_CLIENT_SIDE_API_BASE_URL }}" \
            -f Dockerfile.ui \
            -t ${{ secrets.DOCKER_USERNAME }}/bookmark-ui-nextjs:latest .


      # Docker Hub Push
      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/bookmark-ui-nextjs:latest