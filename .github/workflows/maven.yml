name: Java CI with Maven

# 어떤 Branch라도 코드가 push될 때마다 workflow 가 실행되도록 함
on:
  push:
    branches:
      - "**"

# Jobs를 통해서 workflow 단계 만들어 준다
jobs:
  build-bookmark-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookmarker-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

# Maven Build 작업시 권한을 설정 접근 허용 +x 실행 권한
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw verify

# docker tty 명령어를 사용하기 위한 환경설정
      - name: Build and Push Image
        if: github.ref == 'refs/heads/main'
        # 현재 실행되고 있는 OS는 내 local PC가 아니라 github의 PC이다. 그렇기 때문에 dockerBuild는 필요 없고 build만 하는게 좋다
        run: |
          ./mvnw clean package jib:dockerBuild -DskipTests
          docker login \
            -u ${{ secrets.DOCKER_USERNAME }} \
            -p ${{ secrets.DOCKER_PASSWORD }}
          docker build \
            -t myimage:latest .
          docker tag myimage:latest ${{ secrets.DOCKER_USERNAME }}/bookmarker-api:latest
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/bookmarker-api:latest


#######################################################
#         bookmar-ui-nextjs 빌드 및 docker 배포         #
#######################################################
  build-bookmarker-ui:
    name: Build bookmarker-ui
    runs-on: ubuntu-latest
    defaults:
      # 배포된 git repository의 폴더명
      run:
        working-directory: ./bookmark-ui-nextjs
    steps:
      #코드체크아웃
      - name: Checkout repository
        uses: actions/checkout@v5

      #Node.js 설정
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      
      #의존성 설치
      - name: Install dependecies
        run: npm ci
      
     
      

      #Next.js 빌드
      - name: Next.js Build
        run: npm run build

      #.env.local 파일 설정
      # 복사해서 사용하지 않는 이유는 UI의 .gitignore 파일은 .env* 파일을 제외 한다
      # 파일을 작성해서 넣어 준다 echo 문서를 만들어 준다
      - name: Create .env 파일 생성
        run: |
          echo "SERVER_SIDE_API_BASE_URL=${{ secrets.SERVER_SIDE_API_BASE_URL }}" > .env.local
          echo "NEXT_PUBLIC_CLIENT_SIDE_API_BASE_URL=${{ secrets.NEXT_PUBLIC_CLIENT_SIDE_API_BASE_URL }}" >> .env.local

      # 메인 브렌치 일경우 Docker 이미지 빌드 및 배포
      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Push Docker image
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile.ui -t ${{ secrets.DOCKER_USERNAME }}/bookmark-ui-nextjs .
          docker push ${{ secrets.DOCKER_USERNAME }}/bookmark-ui-nextjs
          
############################################################
# Kubernetes 배포 Job
#
# 목적:
# Docker Hub에 Push된 최신 이미지를 KinD Kubernetes에 반영
#
# 동작 순서:
# 1. GitHub Actions에서 Ubuntu 서버로 SSH 접속
# 2. kubectl이 사용할 Kubernetes 설정 파일 지정
# 3. 서버 내부의 /k8s YAML 파일 적용
#    - 없으면 Kubernetes 리소스 생성(Create)
#    - 있으면 변경된 설정으로 수정(Update)
# 4. Deployment 재시작
#    - 기존 Pod 종료
#    - 새로운 Pod 생성
#    - imagePullPolicy: Always 설정 시 최신 이미지 다운로드
# 5. 새로운 Pod가 정상 상태가 될 때까지 대기
############################################################
deploy:
  name: Deploy to KinD Kubernetes
  runs-on: ubuntu-latest

  # API와 UI Docker Image Build 및 Push가
  # 성공적으로 완료된 후 배포 진행
  needs:
    - build-bookmarker-api
    - build-bookmarker-ui

  # main 브랜치 Push일 경우에만 배포 수행
  if: github.ref == 'refs/heads/main'

  steps:
    ########################################################
    # Ubuntu 서버에 SSH 접속하여 Kubernetes 배포
    ########################################################
    - name: SSH Deploy
      uses: appleboy/ssh-action@v0.1.7

      with:
        # SSH 접속 주소
        # ngrok TCP 주소 또는 서버 공인 IP
        host: ${{ secrets.SERVER_IP }}

        # SSH 접속 포트
        # 일반 SSH는 22번, ngrok TCP 사용 시 할당된 포트 사용
        port: ${{ secrets.SERVER_PORT }}

        # Ubuntu 로그인 계정
        username: ${{ secrets.SERVER_USERNAME }}

        # Ubuntu 로그인 비밀번호
        password: ${{ secrets.SERVER_PASSWORD }}

        script: |
          echo "================================="
          echo " Kubernetes Deploy Start"
          echo "================================="

          # kubectl이 사용할 Kubernetes 인증 파일 지정
          # GitHub Actions SSH 환경에서 kubeconfig 위치를
          # 명확하게 지정하기 위해 설정
          export KUBECONFIG=/home/ubuntu/.kube/config

          echo "===== Kubernetes Cluster 확인 ====="

          # 현재 연결 가능한 Kubernetes Node 확인
          kubectl get nodes

          echo "===== 현재 Pod 상태 확인 ====="

          # 현재 실행 중인 Pod 목록 확인
          kubectl get pods


          echo "===== Kubernetes YAML 적용 ====="

          # Ubuntu 서버 내부의 /k8s 디렉터리에 존재하는
          # 모든 YAML 파일을 Kubernetes Cluster에 적용
          #
          # kubectl apply 특징
          # - Kubernetes 리소스가 없으면 생성(Create)
          # - 기존 리소스가 있으면 변경 사항 수정(Update)
          kubectl apply -f /k8s


          echo "===== Deployment 재시작 ====="

          # 새로운 Docker Image를 적용하기 위해
          # Deployment를 강제로 재시작
          #
          # imagePullPolicy: Always 설정 필요
          kubectl rollout restart deployment/bookmarker-api-deployment

          kubectl rollout restart deployment/bookmarker-ui-deployment


          echo "===== 새로운 Pod 실행 대기 ====="

          # 새로운 Pod가 정상 상태(Ready)가 될 때까지 대기
          kubectl rollout status deployment/bookmarker-api-deployment

          kubectl rollout status deployment/bookmarker-ui-deployment


          echo "================================="
          echo " Kubernetes Deploy Complete"
          echo "================================="